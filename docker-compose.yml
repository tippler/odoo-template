services:

  haproxy:                      
    image: haproxy:${HAPROXY_VERSION}
    container_name: odoo-${APP}-haproxy
    restart: unless-stopped                                           
    ports:                    
      - "127.0.0.1:${HAPROXY_PORT}:8080" 
    volumes: 
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro   
    depends_on:                    
      - odoo                 
    networks:                                                         
      - odoo-net   

  odoo:
    image: odoo:${ODOO_VERSION}
    container_name: odoo-${APP}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_PORT}:8069"
      - "127.0.0.1:${ODOO_GEVENT_PORT}:${ODOO_GEVENT_PORT}"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./custom-addons:/mnt/extra-addons:ro
    environment:
      - HOST=${ODOO_DB_HOST}
      - USER=${ODOO_DB_USER}
      - PASSWORD=${ODOO_DB_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ODOO_PORT}/web/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    networks:
      - odoo-net

  db:
    image: postgres:${POSTGRES_VERSION}
    container_name: odoo-db-${APP}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    networks:
      - odoo-net
    # PostgreSQL tuning for Odoo
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=100"

volumes:
  odoo-data:
    name: odoo-${APP}_odoo-data
    external: true
  db-data:
    name: odoo-${APP}_db-data
    external: true
   

networks:
  odoo-net:
    driver: bridge
