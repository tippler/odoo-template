[options]

; ============================================================
; DATABASE
; ============================================================

admin_passwd = odoo

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Only allow databases matching this pattern if desired
; dbfilter = ^%d$

; ============================================================
; ADDONS
; ============================================================

addons_path = /opt/odoo/odoo/addons,/mnt/extra-addons

data_dir = /var/lib/odoo

; ============================================================
; HTTP
; ============================================================

http_port = 8069

; Cloudflare Tunnel / reverse proxy
proxy_mode = True

; Odoo's long-polling/gevent port
gevent_port = 8072

; ============================================================
; WORKERS
; ============================================================

workers = 4
max_cron_threads = 2

; ============================================================
; RESOURCE LIMITS
; ============================================================

limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

limit_request = 8192

limit_time_cpu = 120
limit_time_real = 240

; ============================================================
; LOGGING
; ============================================================

logfile = /var/log/odoo/odoo.log
log_level = info

; ============================================================
; SECURITY
; ============================================================

list_db = True

