
global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull

    timeout connect 10s
    timeout client  720s
    timeout server  720s
    timeout tunnel  1h

frontend odoo_frontend
    bind *:8080

    option forwardfor

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]

    acl is_websocket path_beg /websocket

    use_backend odoo_gevent if is_websocket
    default_backend odoo_backend

backend odoo_backend
    server odoo odoo:8069 check

backend odoo_gevent
    server odoo-gevent odoo:8072 check

